plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rycreo.appblocker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rycreo.appblocker'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Personal testing build: signed with the standard debug key so it can be installed.
            // For long-term private distribution, replace with a private keystore kept in GitHub Secrets.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}